name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends jq qt6-declarative-dev-tools

      - name: Validate plugin manifest
        env:
          OMARCHY_REVISION: 346e69e1cec6c4e8924531874af6ba010a1bc99e
        run: |
          validator="$RUNNER_TEMP/omarchy-plugin-validate"
          curl --proto '=https' --tlsv1.2 -fsSLo "$validator" \
            "https://raw.githubusercontent.com/omacom/omarchy/$OMARCHY_REVISION/bin/omarchy-plugin-validate"
          bash "$validator" "$GITHUB_WORKSPACE"

      - name: Test model
        run: node --test tests/*.test.js

      - name: Check QML syntax
        run: tools/check-qml.sh
